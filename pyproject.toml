[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growing-personal-assistant"
version = "0.4.0"
description = "A small, file-backed personal notification assistant"
requires-python = ">=3.10"
dependencies = ["Flask[dotenv]>=3.1,<3.2", "playwright>=1.63,<1.64", "waitress>=3.0.2,<4"]

[project.scripts]
personal-assistant = "assistant.__main__:main"

[tool.setuptools.packages.find]
include = ["assistant*"]

[tool.setuptools.package-data]
assistant = ["templates/*.html", "static/*.css", "static/*.js", "static/*.json", "static/vendor/*"]
